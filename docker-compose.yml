services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
    volumes:
      # O índice é montado do host para não reconstruir a cada build.
      - ./data:/app/data
